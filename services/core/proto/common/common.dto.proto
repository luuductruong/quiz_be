syntax = "proto3";

option go_package = "github.com/quiz_be/services/core/application/common";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
package dto;

message LocalizedText {
  string text = 1;
  string key = 2;
  repeated google.protobuf.Value args = 3;
}

message AppError {
  string code = 1;
  LocalizedText localized_message = 2;
  map<string, AppError> validation = 3;
}